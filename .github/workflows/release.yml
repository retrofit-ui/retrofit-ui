name: Release

on:
  push:
    branches: [main]

# Prevent two release runs from racing if commits land back-to-back.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push version bump commit + tags
      pull-requests: write   # open/update the Version Packages PR
      id-token: write        # OIDC for npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # changesets walks git history for CHANGELOG generation

      - uses: pnpm/action-setup@v4
        # No `version:` — reads packageManager from root package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # ships with npm CLI new enough for OIDC / Trusted Publishing
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Debug OIDC identity (temporary — remove after Trusted Publishing is confirmed working)
        run: |
          ID_TOKEN=$(curl -sSf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r .value)
          echo "=== OIDC token claims sent to npm ==="
          echo "$ID_TOKEN" | python3 -c "import sys, json, base64; t = sys.stdin.read().strip(); p = t.split('.')[1]; p += '=' * (-len(p) % 4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))"

      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # Using GITHUB_TOKEN means the Version PR will NOT trigger downstream
          # workflows (like ci.yml). If we want CI to run on the Version PR,
          # swap this for a fine-grained PAT stored as secrets.GH_PAT.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN intentionally omitted — auth is handled via OIDC
          # once Trusted Publisher is configured on each npm package.
          NPM_CONFIG_PROVENANCE: 'true'
