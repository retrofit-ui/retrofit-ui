<svg viewBox="0 0 820 380" role="img" aria-labelledby="rf-contract-title rf-contract-desc" xmlns="http://www.w3.org/2000/svg">
  <style>:root {
    --rf-red: #e8695d;
    --rf-orange: #f2a541;
    --rf-teal: #4fb0a5;
    --rf-blue: #5b8fd6;
    --rf-purple: #8a6fc9;
    --rf-ink: #213547;
    --rf-ink-2: #476582;
    --rf-ink-3: #90a4b7;
    --rf-panel-border: #e2e2e3;
    --vp-c-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --rf-red: #ff7a6d;
      --rf-orange: #ffb85a;
      --rf-teal: #6bd0c3;
      --rf-blue: #7ea6e6;
      --rf-purple: #a58ce0;
      --rf-ink: #eeeef0;
      --rf-ink-2: #b5b5b8;
      --rf-ink-3: #7c7c7f;
      --rf-panel-border: #2e2e32;
      --vp-c-bg: #1b1b1f;
    }
  }</style>
      <title id="rf-contract-title">The spec is the contract</title>
      <desc id="rf-contract-desc">Producers on the left (builder-zod and builder-java) and a renderer on the right (spa-solid-shoelace) both meet at a central spec JSON, which sits on top of the @retrofit-ui/core foundation. Producers never talk directly to the renderer.</desc>
      <defs>
        <marker id="rf-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
        </marker>
      </defs>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
        <g transform="translate(40,50)">
          <rect width="200" height="60" rx="10" fill="var(--rf-teal)" opacity="0.15" />
          <rect width="200" height="60" rx="10" fill="none" stroke="var(--rf-teal)" stroke-width="1.5" />
          <text x="100" y="30" text-anchor="middle" fill="var(--rf-ink)" font-weight="600">@retrofit-ui/builder-zod</text>
          <text x="100" y="48" text-anchor="middle" fill="var(--rf-ink-3)" font-size="11" font-family="system-ui, -apple-system, sans-serif">TypeScript / Node</text>
        </g>
        <g transform="translate(40,150)">
          <rect width="200" height="60" rx="10" fill="var(--rf-teal)" opacity="0.15" />
          <rect width="200" height="60" rx="10" fill="none" stroke="var(--rf-teal)" stroke-width="1.5" />
          <text x="100" y="30" text-anchor="middle" fill="var(--rf-ink)" font-weight="600">builder-java</text>
          <text x="100" y="48" text-anchor="middle" fill="var(--rf-ink-3)" font-size="11" font-family="system-ui, -apple-system, sans-serif">Spring Boot</text>
        </g>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
        <g transform="translate(580,100)">
          <rect width="200" height="60" rx="10" fill="var(--rf-purple)" opacity="0.15" />
          <rect width="200" height="60" rx="10" fill="none" stroke="var(--rf-purple)" stroke-width="1.5" />
          <text x="100" y="30" text-anchor="middle" fill="var(--rf-ink)" font-weight="600">spa-solid-shoelace</text>
          <text x="100" y="48" text-anchor="middle" fill="var(--rf-ink-3)" font-size="11" font-family="system-ui, -apple-system, sans-serif">browser SPA</text>
        </g>
      </g>
      <g transform="translate(340,90)">
        <rect width="140" height="70" rx="35" fill="var(--rf-orange)" opacity="0.18" />
        <rect width="140" height="70" rx="35" fill="none" stroke="var(--rf-orange)" stroke-width="2" />
        <text x="70" y="34" text-anchor="middle" fill="var(--rf-ink)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">spec</text>
        <text x="70" y="54" text-anchor="middle" fill="var(--rf-ink-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">JSON</text>
      </g>
      <g>
        <line x1="240" y1="80" x2="336" y2="112" stroke="var(--rf-teal)" stroke-width="2" marker-end="url(#rf-arrow-c)" color="var(--rf-teal)" />
        <line x1="240" y1="180" x2="336" y2="140" stroke="var(--rf-teal)" stroke-width="2" marker-end="url(#rf-arrow-c)" color="var(--rf-teal)" />
        <text x="288" y="86" text-anchor="middle" fill="var(--rf-teal)" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="600">produce</text>
        <text x="288" y="172" text-anchor="middle" fill="var(--rf-teal)" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="600">produce</text>
      </g>
      <g>
        <line x1="484" y1="125" x2="576" y2="128" stroke="var(--rf-purple)" stroke-width="2" marker-end="url(#rf-arrow-c)" color="var(--rf-purple)" />
        <text x="530" y="118" text-anchor="middle" fill="var(--rf-purple)" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="600">reconcile → DOM</text>
      </g>
      <g transform="translate(40,260)">
        <rect width="740" height="56" rx="10" fill="var(--rf-blue)" opacity="0.12" />
        <rect width="740" height="56" rx="10" fill="none" stroke="var(--rf-blue)" stroke-width="1.5" />
        <text x="370" y="28" text-anchor="middle" fill="var(--rf-ink)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">@retrofit-ui/core</text>
        <text x="370" y="46" text-anchor="middle" fill="var(--rf-ink-2)" font-family="system-ui, -apple-system, sans-serif" font-size="11">the contract — spec types and validators every side agrees on</text>
      </g>
      <line x1="410" y1="160" x2="410" y2="260" stroke="var(--rf-blue)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
      <text x="410" y="345" text-anchor="middle" fill="var(--rf-ink-3)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic">Producers and renderer never talk directly — only through the spec.</text>
    </svg>
