name: Release

on:
  push:
    branches: [main]

# Prevent two release runs from racing if commits land back-to-back.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push version bump commit + tags
      pull-requests: write   # open/update the Version Packages PR
      id-token: write        # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # changesets walks git history for CHANGELOG generation

      - uses: pnpm/action-setup@v4
        # No `version:` — reads packageManager from root package.json

      # No `registry-url`: it writes an .npmrc with a placeholder token, and
      # Trusted Publishing needs no token at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 26   # Active LTS (Lithium) since 2026-10-28; ships npm 11.20
          cache: 'pnpm'

      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10, which
      # publishes unauthenticated and gets a 404). pnpm publish hands the
      # upload to this npm.
      - name: Check npm supports Trusted Publishing
        run: npx --yes semver@7 -r '>=11.5.1' "$(npm --version)"

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Belt-and-braces: pack each public package and fail the release BEFORE
      # anything reaches npm if a workspace: range would leak (#130). Runs in
      # pack is local/offline.
      - name: Verify published manifests resolve workspace deps
        run: pnpm verify:publish

      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          # `pnpm exec changeset publish` runs the publish step only —
          # deliberately NOT `pnpm release`, which also runs `pnpm build`
          # with publish credentials in reach.
          publish: pnpm exec changeset publish
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # Using GITHUB_TOKEN means the Version PR will NOT trigger downstream
          # workflows (like ci.yml). If we want CI to run on the Version PR,
          # swap this for a fine-grained PAT stored as secrets.GH_PAT.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: npm publishes via Trusted Publishing (OIDC), set up
          # per package on npmjs.com for this repo + release.yml. Provenance
          # is generated automatically. changesets/action only writes an
          # .npmrc when NPM_TOKEN is set, so it stays out of the way.
