name: Release

on:
  push:
    branches: [main]

# Prevent two release runs from racing if commits land back-to-back.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push version bump commit + tags
      pull-requests: write   # open/update the Version Packages PR
      # id-token: write     # only needed for OIDC/Trusted Publishing/provenance;
                            # off for now while we're on token auth (see below).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # changesets walks git history for CHANGELOG generation

      - uses: pnpm/action-setup@v4
        # No `version:` — reads packageManager from root package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # ships with npm CLI new enough for OIDC / Trusted Publishing
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # Using GITHUB_TOKEN means the Version PR will NOT trigger downstream
          # workflows (like ci.yml). If we want CI to run on the Version PR,
          # swap this for a fine-grained PAT stored as secrets.GH_PAT.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token-based publish. Trusted Publishing (OIDC) had unresolved
          # 404 issues with our brand-new npm org + auth-and-writes 2FA setup.
          # Fallback: granular npm token with:
          #   - Packages/scopes: read+write on @retrofit-ui
          #   - Organizations: read-only on retrofit-ui (needed because the
          #     scope is org-owned, not user-owned)
          # 365-day expiry; rotate before then. TP is the intended end-state.
          # id-token: write is retained so provenance attestations still sign
          # via sigstore — each published tarball keeps the "Built and signed
          # on GitHub Actions" badge on npmjs.com.
          # TODO(supply-chain): split build (no token) from publish (token)
          # so devDeps executed during `pnpm build` can't observe NPM_TOKEN.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NPM_CONFIG_PROVENANCE intentionally OFF for now: with recent npm
          # CLI versions, enabling it appears to cause npm to prefer OIDC
          # (Trusted Publishing) over the NPM_TOKEN auth, and TP is broken
          # for this account. Re-enable once TP is fixed to get the "Built
          # and signed on GitHub Actions" badge back on npmjs.com.
