pre-commit:
  commands:
    lint:
      run: |
        if git diff --name-only origin/main...HEAD 2>/dev/null | grep -qv '^docs/'; then
          pnpm lint
        else
          echo "Only docs/ changed — skipping CI"
        fi

pre-push:
  commands:
    ci:
      run: |
        if git diff --name-only origin/main...HEAD 2>/dev/null | grep -qv '^docs/'; then
          act -j ci
        else
          echo "Only docs/ changed — skipping CI"
        fi
