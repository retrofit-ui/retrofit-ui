name: Java CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/retrofit-ui-spring-boot-**/**'
      - 'examples/java/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/ci-java.yml'
  pull_request:
    paths:
      - 'packages/retrofit-ui-spring-boot-**/**'
      - 'examples/java/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/ci-java.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install Playwright browsers
        run: |
          ./gradlew :examples:java:todos:installPlaywrightBrowsers \
                    :examples:java:contacts:installPlaywrightBrowsers

      - name: Build and test
        run: ./gradlew build test --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/build/reports/tests/'
