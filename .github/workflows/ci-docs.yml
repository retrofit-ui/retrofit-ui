name: CI (docs)

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/ci-docs.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build docs and its workspace dependencies in topological order.
      # The trailing "..." selects the package plus everything it depends on.
      - run: pnpm --filter "@retrofit-ui/docs..." build
